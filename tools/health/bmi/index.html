function toggleHeightUnit(){
const type=document.getElementById("heightUnit").value;
document.getElementById("heightCm").style.display = type==="cm"?"block":"none";
document.getElementById("heightFtInGroup").classList.toggle("hidden", type==="cm");
}
function toggleWeightUnit(){
const type=document.getElementById("weightUnit").value;
document.getElementById("weightKg").style.display = type==="kg"?"block":"none";
document.getElementById("weightLb").classList.toggle("hidden", type==="kg");
}
function calculate(){
let height=0;
let weight=0;
const heightUnit=document.getElementById("heightUnit").value;
const weightUnit=document.getElementById("weightUnit").value;
if(heightUnit==="cm"){
height=parseFloat(document.getElementById("heightCm").value);
}else{
const ft=parseFloat(document.getElementById("heightFt").value)||0;
const inch=parseFloat(document.getElementById("heightIn").value)||0;
height=(ft*12+inch)*2.54;
}
if(weightUnit==="kg"){
weight=parseFloat(document.getElementById("weightKg").value);
}else{
weight=parseFloat(document.getElementById("weightLb").value)*0.453592;
}
const age=parseInt(document.getElementById("age").value);
const gender=document.getElementById("gender").value;
if(!height||!weight||!age){
alert("Fill all fields");
return;
}
const h=height/100;
const bmi=weight/(h*h);
const category =
bmi<18.5?"Underweight":
bmi<24.9?"Normal":
bmi<29.9?"Overweight":"Obese";
const bmr = gender==="male"
? 10*weight+6.25*height-5*age+5
: 10*weight+6.25*height-5*age-161;
const resultBox=document.getElementById("resultBox");
resultBox.innerHTML=
`<strong>BMI:</strong> ${bmi.toFixed(1)} (${category})<br>
<strong>BMR:</strong> ${bmr.toFixed(0)} kcal/day`;
resultBox.style.display="block";
}
/* Dark mode */
function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
updateDarkMode();
window.matchMedia('(prefers-color-scheme: dark)')
.addEventListener('change',updateDarkMode);
toggleHeightUnit();
toggleWeightUnit();
</script></body>
