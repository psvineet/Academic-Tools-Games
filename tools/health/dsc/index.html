function showForm(method){
document.getElementById("weightSection").classList.add("hidden");
document.getElementById("ageSection").classList.add("hidden");
document.getElementById("bsaSection").classList.add("hidden");
if(method==="weight") document.getElementById("weightSection").classList.remove("hidden");
if(method==="age") document.getElementById("ageSection").classList.remove("hidden");
if(method==="bsa") document.getElementById("bsaSection").classList.remove("hidden");
}
function toggleBSA(val){
document.getElementById("bsaAuto").classList.toggle("hidden",val!=="auto");
document.getElementById("bsaManual").classList.toggle("hidden",val!=="manual");
}
function calculate(){
const method=document.getElementById("method").value;
const adultDose=parseFloat(document.getElementById("adultDose").value);
let dose=0;
if(method==="weight"){
let w=parseFloat(weight.value);
if(weightUnit.value==="lb") w/=2.20462;
dose=(w/70)*adultDose;
}
if(method==="age"){
let a=parseFloat(age.value);
if(ageUnit.value==="months"){
dose=(a/150)*adultDose;
}else{
dose=(a/(a+12))*adultDose;
}
}
if(method==="bsa"){
let bsa=0;
if(bsaMethod.value==="manual"){
bsa=parseFloat(manualBSA.value);
}else{
bsa=Math.sqrt((height.value*bsaWeight.value)/3600);
}
dose=(bsa/1.73)*adultDose;
}
const box=document.getElementById("resultBox");
if(dose>0){
box.innerHTML="Recommended Dose: <strong>"+dose.toFixed(2)+" mg</strong>";
}else{
box.innerText="Enter valid values";
}
box.style.display="block";
}
/* Dark mode */
function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
updateDarkMode();
window.matchMedia('(prefers-color-scheme: dark)')
.addEventListener('change',updateDarkMode);
</script></body>
