72']();</script><script>
function updateForm() {
const type = document.getElementById("type").value;
const form = document.getElementById("form");
const result = document.getElementById("result");
result.style.display = 'none';
let html = '';
switch (type) {
case 'molarity':
html = `
<label>Mass of solute (g)</label><input type="number" id="mass">
<label>Molar mass (g/mol)</label><input type="number" id="molarMass">
<label>Volume of solution (L)</label><input type="number" id="volume">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'molality':
html = `
<label>Weight of solute (g)</label><input type="number" id="solute">
<label>Molecular weight (g/mol)</label><input type="number" id="mol_weight">
<label>Mass of solvent (kg)</label><input type="number" id="solvent">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'normality':
html = `
<label>Mass of solute (g)</label><input type="number" id="mass">
<label>Equivalent weight (g/eq)</label><input type="number" id="eqWeight">
<label>Volume of solution (L)</label><input type="number" id="volume">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'formality':
html = `
<label>Mass of solute (g)</label><input type="number" id="mass">
<label>Formula weight (g/mol)</label><input type="number" id="fw">
<label>Volume of solution (L)</label><input type="number" id="volume">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'ppm':
case 'ppb':
html = `
<label>Mass of solute (mg)</label><input type="number" id="mass">
<label>Volume of solution (L)</label><input type="number" id="solution">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'volFromConc':
html = `
<label>Mass of solute (g)</label><input type="number" id="mass">
<label>Molar mass (g/mol)</label><input type="number" id="molarMass">
<label>Concentration (mol/L)</label><input type="number" id="conc">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'massFromConc':
html = `
<label>Concentration (mol/L)</label><input type="number" id="conc">
<label>Volume (L)</label><input type="number" id="volume">
<label>Molar mass (g/mol)</label><input type="number" id="molarMass">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'dilution':
html = `
<label>Initial Concentration (C₁)</label><input type="number" id="c1">
<label>Initial Volume (V₁)</label><input type="number" id="v1">
<label>Final Concentration (C₂)</label><input type="number" id="c2">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'percent':
html = `
<label>Type of Percent Solution</label>
<select id="percentType">
<option value="w_w">w/w</option>
<option value="v_v">v/v</option>
<option value="w_v">w/v</option>
</select>
<label>Amount of solute</label><input type="number" id="solute">
<label>Amount of solution</label><input type="number" id="solution">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'moleFraction':
html = `
<label>Moles of component A</label><input type="number" id="molA">
<label>Moles of component B</label><input type="number" id="molB">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'conductivity':
html = `
<label>Conductance (G, S)</label><input type="number" id="G">
<label>Cell constant (K, cm⁻¹)</label><input type="number" id="K">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'buffer':
html = `
<label>pKa</label><input type="number" id="pka">
<label>[A⁻] (Conjugate base)</label><input type="number" id="a">
<label>[HA] (Acid)</label><input type="number" id="ha">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
case 'ph':
html = `
<label>Hydrogen ion concentration [H⁺] (mol/L)</label><input type="number" id="h">
<button onclick="calculate('${type}')">Calculate</button>`;
break;
}
form.innerHTML = html;
}
function calculate(type) {
const result = document.getElementById("result");
let output = '';
switch (type) {
case 'molarity':
output = `Molarity: ${(parseFloat(mass.value) / parseFloat(molarMass.value) / parseFloat(volume.value)).toFixed(4)} mol/L`;
break;
case 'molality':
const solute = document.getElementById("solute");
const mol_weight = document.getElementById("mol_weight");
const solvent = document.getElementById("solvent");
const moles = parseFloat(solute.value) / parseFloat(mol_weight.value);
const molality = moles / parseFloat(solvent.value);
output = `Molality: ${molality.toFixed(4)} mol/kg`;
break;
case 'normality':
output = `Normality: ${(parseFloat(mass.value) / parseFloat(eqWeight.value) / parseFloat(volume.value)).toFixed(4)} eq/L`;
break;
case 'formality':
output = `Formality: ${(parseFloat(mass.value) / parseFloat(fw.value) / parseFloat(volume.value)).toFixed(4)} F`;
break;
case 'ppm':
output = `PPM: ${(parseFloat(mass.value) / parseFloat(solution.value) * 1000).toFixed(2)} ppm`;
break;
case 'ppb':
output = `PPB: ${(parseFloat(mass.value) / parseFloat(solution.value) * 1000000).toFixed(2)} ppb`;
break;
case 'volFromConc':
const molesNeeded = parseFloat(mass.value) / parseFloat(molarMass.value);
output = `Required Volume: ${(molesNeeded / parseFloat(conc.value)).toFixed(4)} L`;
break;
case 'massFromConc':
output = `Mass of solute: ${(parseFloat(conc.value) * parseFloat(volume.value) * parseFloat(molarMass.value)).toFixed(4)} g`;
break;
case 'dilution':
output = `Required Volume (V₂): ${(parseFloat(c1.value) * parseFloat(v1.value) / parseFloat(c2.value)).toFixed(4)} L`;
break;
case 'percent':
const percentType = document.getElementById("percentType").value;
const sol = parseFloat(document.getElementById("solute").value);
const soln = parseFloat(document.getElementById("solution").value);
let label = '';
if(percentType==='w_w') label='w/w';
if(percentType==='v_v') label='v/v';
if(percentType==='w_v') label='w/v';
output = `Percent Solution (${label}): ${(sol / soln * 100).toFixed(2)}%`;
break;
case 'moleFraction':
output = `Mole Fraction of A: ${(parseFloat(molA.value) / (parseFloat(molA.value) + parseFloat(molB.value))).toFixed(4)}`;
break;
case 'conductivity':
output = `Conductivity: ${(parseFloat(G.value) * parseFloat(K.value)).toFixed(4)} S/cm`;
break;
case 'buffer':
output = `pH of Buffer: ${(parseFloat(pka.value) + Math.log10(parseFloat(a.value) / parseFloat(ha.value))).toFixed(2)}`;
break;
case 'ph':
output = `pH: ${(-Math.log10(parseFloat(h.value))).toFixed(2)}`;
break;
}
result.innerText = output;
result.style.display = 'block';
}
</script></body>
</html>
