function updateUnits(){
const category=document.getElementById("category").value;
const from=document.getElementById("from");
const to=document.getElementById("to");
from.innerHTML=to.innerHTML='';
for(let unit in units[category]){
from.innerHTML+=`<option value="${unit}">${unit}</option>`;
to.innerHTML+=`<option value="${unit}">${unit}</option>`;
}
document.getElementById("result").style.display="none";
}
function convert(){
const category=document.getElementById("category").value;
const fromUnit=document.getElementById("from").value;
const toUnit=document.getElementById("to").value;
const inputValue=parseFloat(document.getElementById("input").value);
const resultEl=document.getElementById("result");
if(isNaN(inputValue)){
resultEl.style.display="none";
return;
}
let value;
if(category==='temperature'){
value=convertTemp(inputValue,fromUnit,toUnit);
}else{
value=(inputValue/units[category][fromUnit])*units[category][toUnit];
}
resultEl.innerText=`= ${value.toFixed(4)}`;
resultEl.style.display="block";
}
function convertTemp(value,from,to){
if(from===to) return value;
if(from==='C') return to==='F'?(value*9/5)+32:value+273.15;
if(from==='F') return to==='C'?(value-32)*5/9:((value-32)*5/9)+273.15;
if(from==='K') return to==='C'?value-273.15:(value-273.15)*9/5+32;
}
updateUnits();

function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
