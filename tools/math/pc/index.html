const prefixes = {
"yocto (y)": 1e-24,
"zepto (z)": 1e-21,
"atto (a)": 1e-18,
"femto (f)": 1e-15,
"pico (p)": 1e-12,
"nano (n)": 1e-9,
"micro (µ)": 1e-6,
"milli (m)": 1e-3,
"centi (c)": 1e-2,
"deci (d)": 1e-1,
"": 1,
"deca (da)": 1e1,
"hecto (h)": 1e2,
"kilo (k)": 1e3,
"mega (M)": 1e6,
"giga (G)": 1e9,
"tera (T)": 1e12,
"peta (P)": 1e15,
"exa (E)": 1e18,
"zetta (Z)": 1e21,
"yotta (Y)": 1e24
};
const fromUnit = document.getElementById("fromUnit");
const toUnit = document.getElementById("toUnit");
const resultBox = document.getElementById("resultBox");
Object.keys(prefixes).forEach(unit=>{
const o1=new Option(unit,unit);
const o2=new Option(unit,unit);
fromUnit.appendChild(o1);
toUnit.appendChild(o2);
});
function convert(){
const val=parseFloat(document.getElementById("value").value);
const from=fromUnit.value;
const to=toUnit.value;
if(isNaN(val)){
alert("Please enter a valid number.");
return;
}
const result=val*prefixes[from]/prefixes[to];
document.getElementById("resultText").innerText =
`${val} ${from} = ${result} ${to}`;
resultBox.style.display="block";
}
/* Dark mode */
function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
updateDarkMode();
window.matchMedia('(prefers-color-scheme: dark)')
.addEventListener('change',updateDarkMode);
</script></body>
