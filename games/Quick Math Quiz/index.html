</div><script>
/* ORIGINAL LOGIC — UNCHANGED */
const questionEl=document.getElementById("question");
const optionsEl=document.getElementById("options");
const feedbackEl=document.getElementById("feedback");
const scoreEl=document.getElementById("score");
const timerEl=document.getElementById("timer");
const difficultyEl=document.getElementById("difficulty");
const startBtn=document.getElementById("startBtn");
let correctAnswer=0;
let score=0;
let time=60;
let timerInterval;
let gameStarted=false;
function getRandomInt(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}
function buildQuestion(difficulty){
let num1,num2;
if(difficulty==="easy"){
num1=getRandomInt(1,10);
num2=getRandomInt(1,10);
}else if(difficulty==="medium"){
num1=getRandomInt(10,30);
num2=getRandomInt(10,30);
}else{
num1=getRandomInt(50,100);
num2=getRandomInt(10,50);
}
const operator=["+","-","×"][Math.floor(Math.random()*3)];
if(operator==="+") correctAnswer=num1+num2;
else if(operator==="-") correctAnswer=num1-num2;
else correctAnswer=num1*num2;
const questionText=`What is ${num1} ${operator} ${num2}?`;
const answers=[correctAnswer];
while(answers.length<3){
let fake=correctAnswer+getRandomInt(-15,15);
if(!answers.includes(fake)&&fake>=0) answers.push(fake);
}
return {questionText,answers:answers.sort(()=>Math.random()-0.5)};
}
function showQuestion({questionText,answers},enable=false){
questionEl.textContent=questionText;
optionsEl.innerHTML="";
answers.forEach(val=>{
const btn=document.createElement("div");
btn.className="cell";
btn.textContent=val;
if(enable) btn.classList.add("active");
btn.onclick=()=>{
if(!gameStarted) return;
checkAnswer(val);
};
optionsEl.appendChild(btn);
});
}
function startGame(){
score=0;
scoreEl.textContent=score;
time=60;
timerEl.textContent=time;
feedbackEl.textContent="";
startBtn.textContent="Restart";
gameStarted=true;
difficultyEl.disabled=true;
clearInterval(timerInterval);
timerInterval=setInterval(()=>{
time--;
timerEl.textContent=time;
if(time<=0){
clearInterval(timerInterval);
feedbackEl.innerHTML="⏰ Time's up! Score: "+score;
gameStarted=false;
difficultyEl.disabled=false;
questionEl.textContent="Click Restart to try again!";
}
},1000);
const next=buildQuestion(difficultyEl.value);
showQuestion(next,true);
}
function checkAnswer(selected){
if(selected===correctAnswer){
score++;
scoreEl.textContent=score;
feedbackEl.textContent="✅ Correct!";
}else{
feedbackEl.textContent="❌ Wrong! Answer was "+correctAnswer;
}
setTimeout(()=>{
if(gameStarted){
const next=buildQuestion(difficultyEl.value);
showQuestion(next,true);
}
},800);
}
const first=buildQuestion(difficultyEl.value);
showQuestion(first,false);
/* Dark mode */
function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
updateDarkMode();
window.matchMedia('(prefers-color-scheme: dark)')
.addEventListener('change',updateDarkMode);
</script></body>
