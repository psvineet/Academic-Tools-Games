</div><script>
/* ORIGINAL LOGIC — UNCHANGED */
let board = [];
let moveCount = 0;
let timer = 0;
let timerInterval;
let gameActive = false;
let startedOnce = false;
const boardEl = document.getElementById('board');
const timerEl = document.getElementById('timer');
const movesEl = document.getElementById('moves');
const startBtn = document.getElementById('start-btn');
const autoBtn = document.getElementById('auto-btn');
function handleStartOrRestart(){
autoBtn.disabled=false;
if(!startedOnce){
startBtn.textContent="Restart Game";
startedOnce=true;
gameActive=true;
moveCount=0;
timer=0;
updateMoves();
timerInterval=setInterval(updateTimer,1000);
render();
}else{
board=shuffle([...Array(15).keys()].map(n=>n+1).concat(null));
gameActive=true;
moveCount=0;
timer=0;
updateMoves();
clearInterval(timerInterval);
timerInterval=setInterval(updateTimer,1000);
render();
}
}
function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}
function render(){
boardEl.innerHTML='';
board.forEach((num,i)=>{
const cell=document.createElement('div');
cell.className='cell';
if(num===null){
cell.classList.add('empty');
}else{
cell.textContent=num;
if(gameActive){
cell.addEventListener('click',()=>moveTile(i));
}
}
boardEl.appendChild(cell);
});
}
function moveTile(index){
if(!gameActive) return;
const emptyIndex=board.indexOf(null);
const validMoves=[index-1,index+1,index-4,index+4];
if(Math.floor(index/4)!==Math.floor((index-1)/4)) validMoves[0]=-1;
if(Math.floor(index/4)!==Math.floor((index+1)/4)) validMoves[1]=-1;
if(validMoves.includes(emptyIndex)){
[board[emptyIndex],board[index]]=[board[index],board[emptyIndex]];
moveCount++;
updateMoves();
render();
checkWin();
}
}
function updateMoves(){
movesEl.textContent=moveCount;
}
function updateTimer(){
timer++;
const minutes=String(Math.floor(timer/60)).padStart(2,'0');
const seconds=String(timer%60).padStart(2,'0');
timerEl.textContent=`${minutes}:${seconds}`;
}
function checkWin(){
const goal=[...Array(15).keys()].map(n=>n+1).concat(null);
const correct=board.reduce((acc,val,i)=>acc+(val===goal[i]?1:0),0);
if(correct===16){
clearInterval(timerInterval);
alert("🎉 Solved in "+timerEl.textContent+" with "+moveCount+" moves!");
gameActive=false;
}
}
function autoSolve(){
if(!startedOnce) return;
board=[...Array(15).keys()].map(n=>n+1).concat(null);
clearInterval(timerInterval);
timerEl.textContent="00:00";
moveCount=0;
updateMoves();
gameActive=false;
render();
}
window.addEventListener('DOMContentLoaded',()=>{
board=shuffle([...Array(15).keys()].map(n=>n+1).concat(null));
render();
setTimeout(()=>{
const popup=document.getElementById('popup');
popup.style.display='none';
},4000);
});
/* Dark mode */
function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
updateDarkMode();
window.matchMedia('(prefers-color-scheme: dark)')
.addEventListener('change',updateDarkMode);
</script></body>
