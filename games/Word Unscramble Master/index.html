</div><script>
/* YOUR ORIGINAL FULL WORD LISTS (UNCHANGED) */
const normalWords = [
"planet","explore","fantasy","justice","freedom","kingdom","harvest","journey","harmony","shelter",
"gravity","pioneer","whistle","balance","village","recycle","library","electric","diamond","science",
"breeze","sunrise","twilight","compass","glacier","nature","riverbank","lantern","compete","reflect",
"decorate","hunger","curious","friendship","symbol","thought","wonder","resolve","courage","comfort",
"belief","whisper","smile","silver","galaxy","mission","history","passion","adventure","laughter",
"magnet","victory","trust","honest","fabric","marble","secret","pattern","hollow","vessel","ignite",
"flavor","crystal","bottle","thread","signal","rocket","button","castle","target","shield","moment",
"bounce","ladder","mirror","garden","window","celebrate","survive","express","explain","remark",
"repeat","belong","divide","create","repair","rescue","forgive","destroy","release","connect",
"arrival","capture","approve","believe","support","perform","acquire","control","deliver","improve"
];
const medicoWords = [
"hemoglobin","osteoporosis","myocardium","pharmacology","anaphylaxis","bronchitis","hypertension",
"antibiotic","echocardiogram","dermatology","gastroenterology","neurology","pathology","antiseptic",
"diuretics","tachycardia","radiology","histamine","placenta","metastasis","endoscopy","biopsy",
"infarction","embolism","thrombosis","hepatitis","pancreatitis","appendicitis","nephrology","oncology",
"cardiology","neuron","ligament","tendon","fibrosis","cyanosis","anemia","malaria","insulin",
"glucose","bacteria","virus","fungus","saliva","intestine","suture","injection","vaccine","therapy",
"diagnosis","prognosis","symptom","treatment","clinical","fracture","ulcer","ischemia","lesion",
"infection","eczema","rash","asthma","tumor","cancer","migraine","fatigue","jaundice","morbid",
"hypertrophy","atrophy","autopsy","urinalysis","serology","immunity","stethoscope","scalpel","syringe"
];
/* ORIGINAL LOGIC (UNCHANGED) */
let wordList = [];
let currentWord = "";
let scrambledWord = "";
let timer;
let timeLeft = 60;
let score = 0;
let gameStarted = false;
const scrambledEl = document.getElementById("scrambled-word");
const inputEl = document.getElementById("guess");
const feedbackEl = document.getElementById("feedback");
const timerEl = document.getElementById("timer");
const scoreEl = document.getElementById("score");
const modeSelect = document.getElementById("mode");
function shuffle(word) {
let arr = word.split('');
let shuffled = "";
do {
shuffled = arr.sort(() => Math.random() - 0.5).join('');
} while (shuffled === word);
return shuffled;
}
function updateWordForMode() {
wordList = modeSelect.value === "normal" ? normalWords : medicoWords;
currentWord = wordList[Math.floor(Math.random() * wordList.length)];
scrambledWord = shuffle(currentWord);
scrambledEl.textContent = scrambledWord;
}
modeSelect.addEventListener("change", () => {
if (!gameStarted) updateWordForMode();
});
function startGame() {
if (gameStarted) {
location.reload();
return;
}
gameStarted = true;
inputEl.disabled = false;
inputEl.value = "";
inputEl.focus();
inputEl.style.display = "block";
document.getElementById("hintBtn").style.display = "inline-block";
document.getElementById("hintBtn").disabled = false;
modeSelect.disabled = true;
score = 0;
scoreEl.textContent = score;
timeLeft = 60;
timerEl.textContent = timeLeft;
feedbackEl.textContent = "";
scrambledEl.textContent = scrambledWord;
document.getElementById("startBtn").textContent = "Restart";
timer = setInterval(() => {
timeLeft--;
timerEl.textContent = timeLeft;
if (timeLeft <= 0) endGame();
}, 1000);
}
function endGame() {
clearInterval(timer);
inputEl.disabled = true;
document.getElementById("hintBtn").disabled = true;
feedbackEl.textContent = `⏱ Time's up! Final score: ${score}`;
}
function pickNewWord() {
currentWord = wordList[Math.floor(Math.random() * wordList.length)];
scrambledWord = shuffle(currentWord);
scrambledEl.textContent = scrambledWord;
inputEl.value = "";
}
function checkAnswer() {
if (!gameStarted) return;
const userGuess = inputEl.value.trim().toLowerCase();
if (userGuess.length < currentWord.length) return;
if (userGuess === currentWord.toLowerCase()) {
score++;
scoreEl.textContent = score;
feedbackEl.textContent = "✅ Correct!";
} else {
feedbackEl.textContent = `❌ Wrong! It was "${currentWord}"`;
}
setTimeout(() => {
feedbackEl.textContent = "";
pickNewWord();
}, 1000);
}
inputEl.addEventListener("input", () => {
if (gameStarted) checkAnswer();
});
function showHint() {
if (!gameStarted) return;
feedbackEl.textContent = `💡 Hint: starts with "${currentWord.charAt(0).toUpperCase()}"`;
}
document.getElementById("startBtn").onclick = startGame;
document.getElementById("hintBtn").onclick = showHint;
/* 🔥 CRITICAL FIX (prevents crash) */
const yearEl = document.getElementById("year");
if (yearEl) yearEl.textContent = new Date().getFullYear();
/* INIT */
document.addEventListener("DOMContentLoaded", () => {
updateWordForMode();
inputEl.style.display = "none";
document.getElementById("hintBtn").style.display = "none";
});
/* Dark mode */
function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
updateDarkMode();
window.matchMedia('(prefers-color-scheme: dark)')
.addEventListener('change',updateDarkMode);
</script></body>
