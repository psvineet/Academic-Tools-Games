</div><script>
/* ORIGINAL LOGIC — UNCHANGED */
const emojiPool = [
'🍎','🍌','🍒','🍇','🍉','🍍','🥝','🥥','🍑','🍋',
'🍈','🍓','🥑','🫐','🍐','🍊','🍅','🌽','🥕','🥔',
'🍩','🍪','🍫','🍿','🧁','🍰','🥨','🧀','🥓','🍔'
];
let board = [];
let flipped = [];
let matched = [];
let gameStarted = false;
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
window.addEventListener('DOMContentLoaded',()=>{
showBlankBoard();
statusEl.textContent="Click 'Start Game' to begin card matching!";
});
startBtn.addEventListener('click',()=>{
startGame();
startBtn.textContent="Restart Game";
});
function showBlankBoard(){
board=Array(16).fill(null);
flipped=[];
matched=[];
renderBoard();
}
function startGame(){
const selectedEmojis=getRandomItems(emojiPool,8);
const gameEmojis=[...selectedEmojis,...selectedEmojis].sort(()=>0.5-Math.random());
board=gameEmojis;
flipped=[];
matched=[];
gameStarted=true;
statusEl.textContent="Find all the pairs!";
renderBoard();
}
function renderBoard(){
boardEl.innerHTML='';
board.forEach((emoji,index)=>{
const cell=document.createElement('div');
cell.className='cell';
if(flipped.includes(index)||matched.includes(index)){
cell.classList.add('flipped');
cell.textContent=emoji;
}else{
cell.textContent='';
}
if(gameStarted && !matched.includes(index)){
cell.addEventListener('click',()=>flipCard(index));
}
boardEl.appendChild(cell);
});
}
function flipCard(index){
if(flipped.includes(index)||matched.includes(index)||flipped.length===2) return;
flipped.push(index);
renderBoard();
if(flipped.length===2){
const[i1,i2]=flipped;
if(board[i1]===board[i2]){
matched.push(i1,i2);
flipped=[];
if(matched.length===board.length){
statusEl.textContent="🎉 You matched all the cards!";
}
}else{
setTimeout(()=>{
flipped=[];
renderBoard();
},800);
}
}
}
function getRandomItems(arr,n){
const shuffled=[...arr].sort(()=>0.5-Math.random());
return shuffled.slice(0,n);
}
/* Dark mode */
function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
updateDarkMode();
window.matchMedia('(prefers-color-scheme: dark)')
.addEventListener('change',updateDarkMode);
</script></body>
