</div><script>
/* YOUR ORIGINAL LOGIC — UNCHANGED */
const colors = [
{ name: 'Red', code: 'red' },
{ name: 'Green', code: 'green' },
{ name: 'Blue', code: 'blue' },
{ name: 'Yellow', code: 'gold' },
{ name: 'Purple', code: 'purple' },
{ name: 'Orange', code: 'orange' }
];
const wordEl = document.getElementById('word');
const timerEl = document.getElementById('timer');
const scoreEl = document.getElementById('score');
const startBtn = document.getElementById('startBtn');
const buttonsEl = document.getElementById('colorButtons');
const instructions = document.getElementById('instructions');
let currentColor = '';
let timer = 30;
let score = 0;
let interval;
let gameStarted = false;
function createButtons(){
buttonsEl.innerHTML='';
colors.forEach(color=>{
const btn=document.createElement('button');
btn.className='color-btn';
btn.style.backgroundColor=color.code;
btn.onclick=()=>handleSelection(color.code);
btn.disabled=true;
buttonsEl.appendChild(btn);
});
}
function enableButtons(enable){
const btns=buttonsEl.querySelectorAll('button');
btns.forEach(btn=>{
btn.disabled=!enable;
btn.style.pointerEvents=enable?'auto':'none';
});
}
function startGame(){
if(!gameStarted){
gameStarted=true;
instructions.style.display='none';
startBtn.textContent='Restart';
}
clearInterval(interval);
score=0;
timer=30;
scoreEl.textContent=score;
timerEl.textContent=timer;
enableButtons(true);
nextWord();
interval=setInterval(()=>{
timer--;
timerEl.textContent=timer;
if(timer<=0){
clearInterval(interval);
wordEl.textContent="⏱ Time's Up!";
enableButtons(false);
}
},1000);
}
function nextWord(){
const word=colors[Math.floor(Math.random()*colors.length)];
const color=colors[Math.floor(Math.random()*colors.length)];
currentColor=color.code;
wordEl.textContent=word.name;
wordEl.style.color=color.code;
}
function handleSelection(color){
if(timer<=0) return;
if(color===currentColor){
score++;
scoreEl.textContent=score;
}
nextWord();
}
createButtons();
/* Dark mode */
function updateDarkMode(){
if(window.matchMedia('(prefers-color-scheme: dark)').matches){
document.documentElement.setAttribute("data-theme","dark");
}else{
document.documentElement.setAttribute("data-theme","light");
}
}
updateDarkMode();
window.matchMedia('(prefers-color-scheme: dark)')
.addEventListener('change',updateDarkMode);
</script></body>
